<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-geomotor.png" />
    <link rel="apple-touch-icon" href="/logo-geomotor.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Geomotor — repuestos y talleres en Venezuela. Busca por zona, contacta vendedores y comparte publicaciones."
    />
    <meta name="application-name" content="Geomotor" />
    <meta name="apple-mobile-web-app-title" content="Geomotor" />
    <title>Geomotor</title>
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/header-banner-sm.webp?v=1"
      imagesrcset="/header-banner-sm.webp?v=1 960w, /header-banner.webp?v=1 1920w"
      imagesizes="(max-width: 900px) 960px, 100vw"
      fetchpriority="high"
    />
    <style>
      /* Reserva el hero antes del CSS de React: evita el salto 447px → móvil (CLS). */
      .landing-hero-banner {
        position: relative;
        width: 100%;
        height: clamp(108px, 21vh, 162px);
        overflow: hidden;
        background: #1e293b;
      }
      @media (min-width: 480px) {
        .landing-hero-banner { height: clamp(142px, 26vh, 210px); }
      }
      @media (min-width: 640px) {
        .landing-hero-banner { height: clamp(175px, 30vh, 265px); }
      }
      @media (min-width: 900px) {
        .landing-hero-banner { height: 400px; }
      }
      @media (min-width: 1100px) {
        .landing-hero-banner { height: 447px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
